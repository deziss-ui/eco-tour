<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17252A">
<meta name="application-name" content="Enviro Audit"><meta name="apple-mobile-web-app-title" content="Enviro Audit">
<title>Enviro Audit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#E8ECEA;--surface:#FFFFFF;--surface2:#F4F6F5;--ink:#17252A;--muted:#5A6A6E;--line:#CBD3D0;--act:#E8661C;--act-ink:#FFFFFF;--ok:#2B7A4B;--ok-bg:#E1F0E6;--bad:#BF3226;--bad-bg:#F8E1DE;--na:#6B7A7E;--na-bg:#E6EAE9;--focus:#1F6FB2;--r:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121A1C;--surface:#1B2629;--surface2:#223034;--ink:#E6EDEB;--muted:#9AAAAD;--line:#33454A;--act:#F07A33;--ok:#5CC285;--ok-bg:#183326;--bad:#F07468;--bad-bg:#3A1E1B;--na:#9AAAAD;--na-bg:#263336;--focus:#6FB0EA}}
:root[data-theme="dark"]{--bg:#121A1C;--surface:#1B2629;--surface2:#223034;--ink:#E6EDEB;--muted:#9AAAAD;--line:#33454A;--act:#F07A33;--ok:#5CC285;--ok-bg:#183326;--bad:#F07468;--bad-bg:#3A1E1B;--na:#9AAAAD;--na-bg:#263336;--focus:#6FB0EA}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik","Arial Hebrew",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2{margin:0;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl{flex:1;min-width:0;text-align:center}.top .ttl small{color:var(--muted);font-size:13px}
.ghost{padding:9px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sm{padding:7px 11px;font-size:14px}
.primary{padding:11px 18px;border-radius:var(--r);background:var(--act);color:var(--act-ink);font-weight:600}
.danger{padding:11px 18px;border-radius:var(--r);background:var(--bad);color:#fff;font-weight:600}
.wide{display:block;width:100%;margin-top:14px}
.danger-link{display:block;margin:22px auto 0;color:var(--bad);text-decoration:underline;padding:8px}
.row{display:flex;gap:8px;align-items:center}.row.end{justify-content:flex-end;margin-top:12px}
.row input{flex:1}
.start{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:14px;background:var(--surface);border:2px solid var(--act);text-align:right}
.start .plus{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--act);color:#fff;font-size:30px;line-height:1}
.start b{display:block;font-size:20px}.start small{color:var(--muted)}
.lbl{font-size:14px;color:var(--muted);font-weight:500;margin:24px 2px 8px}
.empty{color:var(--muted);text-align:center;padding:24px 10px}.empty.sm{padding:10px;font-size:14px}
.list{display:grid;gap:8px}
.tcard{display:flex;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:right}
.tc-main{min-width:0}.tc-main b{display:block}.tc-main span{font-size:14px;color:var(--muted)}
.tc-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.tc-side small{color:var(--muted);font-size:13px}
.backup{justify-content:center;margin-top:26px}
.warn{background:var(--bad-bg);color:var(--bad);padding:10px;border-radius:var(--r);font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.na{background:var(--na-bg);color:var(--na)}
.form label{display:block;margin:14px 0 0;font-size:14px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea,.fu textarea,.fu input{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:16px}
.form textarea,.fu textarea{resize:vertical}
fieldset{margin:18px 0 0;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px}
legend{font-size:14px;color:var(--muted);font-weight:500;padding:0 6px}
.pp{display:flex;gap:6px;margin-bottom:6px}.pp input{margin:0;flex:1;min-width:0}
.x{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--muted)}
.two,.three{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{grid-template-columns:1fr 1fr 1fr}
@media (max-width:420px){.three{grid-template-columns:1fr 1fr}.three label:first-child{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}.chip.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
#tplBox{margin-top:18px}
.tplhead b{display:block;font-size:14px;color:var(--muted);font-weight:500}
.sug{display:block;margin-top:4px;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface2);border-inline-start:4px solid var(--act)}
.tpls{display:grid;gap:8px;margin-top:8px}
.tpl{text-align:right;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tpl b{display:block}.tpl em{font-style:normal;font-size:12px;background:var(--act);color:#fff;padding:1px 7px;border-radius:999px;margin-inline-start:6px;vertical-align:2px}
.tpl small{color:var(--muted);font-size:13px}
.tpl.on{border:2px solid var(--ink);padding:10px 11px}
.tpl:disabled:not(.on){opacity:.45}
.hint{color:var(--muted);font-size:14px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4;display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{flex:1 0 auto;padding:12px 14px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--act)}
.sec{margin-bottom:22px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 8px}
.sectitle{text-align:right;font-weight:600;font-size:16px;padding:4px 0}.sectitle span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.fcard{display:flex;gap:12px;width:100%;margin-bottom:8px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:right;align-items:stretch}
.fcard.unset{background:var(--surface2);border-style:dashed}
.thumb{position:relative;flex:none;width:84px;height:84px;border-radius:7px;overflow:hidden;background:var(--na-bg);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{font-size:12px;color:var(--muted)}
.thumb i{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:12px;padding:0 6px;border-radius:6px}
.fcard.unset .thumb{width:48px;height:48px}
.fbody{min-width:0;flex:1}
.fhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fbody p{margin:4px 0 2px;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fbody small{font-size:13px;color:var(--muted)}
.spacer{height:90px}
.shutter{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);z-index:6;width:76px;height:76px;border-radius:50%;background:var(--surface);border:4px solid var(--act);box-shadow:0 4px 18px rgba(0,0,0,.25);display:grid;place-items:center}
.shutter span{width:56px;height:56px;border-radius:50%;background:var(--act);position:relative}
.shutter span::after{content:"";position:absolute;inset:16px 13px 15px;border:3px solid #fff;border-radius:5px}
.shutter span::before{content:"";position:absolute;top:12px;left:22px;width:12px;height:6px;background:#fff;border-radius:2px 2px 0 0}
.shutter:active{transform:translateX(-50%) scale(.94)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{flex:1;padding:8px 6px;font-size:14px;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--ink);color:var(--surface);font-weight:600}
.seg button.on.ok{background:var(--ok);color:#fff}.seg button.on.bad{background:var(--bad);color:#fff}.seg button.on.na{background:var(--na);color:#fff}
.seg.big{margin-top:16px}.seg.big button{padding:13px 6px;font-size:16px}
.sumlist{display:grid;gap:6px;margin-top:10px}
.sumrow{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
@media (max-width:420px){.sumrow{grid-template-columns:1fr}}
.fu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px}
.fu label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
.fu .row{align-items:flex-start}
.exp h2{font-size:20px;margin-top:6px}
.issues{margin:16px 0;padding:12px 14px;border-radius:var(--r);background:var(--bad-bg)}.issues ul{margin:6px 0 0;padding-inline-start:20px}
.issues.okk{background:var(--ok-bg);color:var(--ok);font-weight:500}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{position:relative}
.phbtn{display:block;width:132px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.phbtn img{display:block;width:132px;height:110px;object-fit:cover}
.phbtn span{display:block;font-size:12px;padding:4px;color:var(--muted)}
.ph .x{position:absolute;top:-8px;left:-8px;width:30px;height:30px;font-size:17px}
.addph{display:flex;flex-direction:column;gap:6px;justify-content:center}
.addph button{width:110px;padding:12px 8px;border:1px dashed var(--muted);border-radius:8px;background:var(--surface);font-size:14px}
.addph button:first-child{border:2px solid var(--act);color:var(--act);font-weight:600}
.ai{margin-top:8px;padding:9px 12px;border-radius:var(--r);border:1px solid var(--focus);color:var(--focus);background:var(--surface);font-size:14px;width:100%}
.ai:disabled{opacity:.6}
#aiOut{min-height:1em;margin-top:4px}
#annot{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#annot[hidden],#dialog[hidden],#busy[hidden],#sheet[hidden]{display:none}
.anbar{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:8px;background:#1b1b1b;flex-wrap:wrap}
.anbar .ghost{background:#2a2a2a;color:#fff;border-color:#444}.anbar .seg{background:#2a2a2a;border-color:#444}.anbar .seg button{color:#fff;border-color:#444}.anbar .seg button.on{background:#fff;color:#000}
.anstage{flex:1;min-height:0;display:grid;place-items:center;padding:6px}
#anCv{max-width:100%;max-height:100%;touch-action:none;display:block}
#dialog{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:14px;padding:18px;width:min(420px,100%)}
.dlg p{margin:0 0 10px;font-size:16px}.dlg input{width:100%;padding:11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.dlg h2{font-size:18px}
#busy{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:grid;place-items:center}
#busy span{background:var(--surface);padding:14px 20px;border-radius:12px;font-weight:500}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);left:50%;transform:translateX(-50%) translateY(20px);z-index:70;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<script src="docx.js"></script>
</head><body>
<div id="app"></div><div id="sheet" hidden></div><div id="annot" hidden></div><div id="dialog" hidden></div>
<div id="busy" hidden><span>רגע…</span></div><div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>

async function buildReport(D, tour, getPhoto, logoBytes) {
  const tpl = TEMPLATES[tour.templateId];
  const H = tour.header || {};
  const FONT = { ascii: 'Arial', hAnsi: 'Arial', cs: 'Arial', eastAsia: 'Arial' };
  const run = (text, o = {}) => new D.TextRun({
    text: String(text ?? ''), rightToLeft: true, font: FONT,
    size: o.size || 20, sizeComplexScript: o.size || 20,
    bold: !!o.bold, boldComplexScript: !!o.bold,
    highlight: o.highlight, underline: o.u ? {} : undefined
  });
  const para = (children, o = {}) => new D.Paragraph({
    bidirectional: true,
    alignment: o.center ? D.AlignmentType.CENTER : undefined,
    spacing: { before: o.before || 0, after: o.after ?? 40, line: 276 },
    keepNext: o.keepNext,
    children: Array.isArray(children) ? children : [children]
  });
  const textParas = (text, o = {}) => String(text || '').split('\n').map(l => para(run(l, o), o));
  const SHADE = { fill: 'F2F2F2', type: D.ShadingType.CLEAR, color: 'auto' };
  const SHADE2 = { fill: 'D9D9D9', type: D.ShadingType.CLEAR, color: 'auto' };
  const cell = (content, o = {}) => new D.TableCell({
    width: o.w ? { size: o.w, type: D.WidthType.DXA } : undefined,
    columnSpan: o.span,
    shading: o.shade === 2 ? SHADE2 : o.shade ? SHADE : undefined,
    margins: { top: 60, bottom: 60, left: 90, right: 90 },
    verticalAlign: o.vcenter ? D.VerticalAlign.CENTER : D.VerticalAlign.TOP,
    children: (Array.isArray(content) ? content : (content instanceof D.Paragraph ? [content] : textParas(content, o)))
  });
  const table = (widths, rows) => new D.Table({
    visuallyRightToLeft: true,
    width: { size: widths.reduce((a, b) => a + b, 0), type: D.WidthType.DXA },
    columnWidths: widths, layout: D.TableLayoutType.FIXED, rows
  });
  const row = (cells, o = {}) => new D.TableRow({ children: cells, tableHeader: !!o.header, cantSplit: !!o.cantSplit });

  async function photoParas(ids, maxW, maxH, center) {
    const runs = [];
    const n = ids.length;
    const eachW = n > 1 ? Math.floor((maxW - 8 * (n - 1)) / Math.min(n, 2)) : maxW;
    for (let i = 0; i < ids.length; i++) {
      const p = await getPhoto(ids[i]);
      if (!p) continue;
      let w = eachW, h = Math.round(eachW * p.h / p.w);
      if (h > maxH) { h = maxH; w = Math.round(maxH * p.w / p.h); }
      runs.push(new D.ImageRun({ type: 'jpg', data: p.bytes, transformation: { width: w, height: h } }));
      if (i < ids.length - 1) runs.push(new D.TextRun({ text: '  ' }));
    }
    if (!runs.length) return [para(run(''))];
    return [new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: runs })];
  }

  const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
  const children = [];
  let pageW, header;

  if (tpl.org === 'tavel') {
    pageW = 16838 - 1440;
    const logo = logoBytes ? [new D.Paragraph({ children: [new D.ImageRun({ type: 'png', data: logoBytes, transformation: { width: 70, height: 64 } })] })] : [];
    header = new D.Header({ children: logo });
    const W3 = [Math.round(pageW / 3), Math.round(pageW / 3), pageW - 2 * Math.round(pageW / 3)];
    const titleKids = [para(run('דוח סיור איכות סביבה', { bold: true, size: 32 }), { center: true })];
    if (tpl.subtitle && H.subtitle) titleKids.push(para(run(H.subtitle, { bold: true, size: 28 }), { center: true }));
    children.push(table(W3, [

/* ---------- storage ---------- */
let idb = null, storageOK = true;
const mem = { tours: new Map(), photos: new Map(), kv: new Map() };
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('eco-tour', 1);
      r.onupgradeneeded = () => { const d = r.result; ['tours', 'photos', 'kv'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      r.onsuccess = () => { idb = r.result; res(); };

}
function idbReq(st, mode, fn) {

      t.oncomplete = () => res(r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    } catch (e) { rej(e); }
  });
}
async function dbPut(st, k, v) { mem[st].set(k, v); if (!idb) return; try { await idbReq(st, 'readwrite', s => s.put(v, k)); } catch (e) { storageWarn(); } }

async function dbDel(st, k) { mem[st].delete(k); if (!idb) return; try { await idbReq(st, 'readwrite', s => s.delete(k)); } catch (e) { } }
async function dbAll(st) { if (!idb) return [...mem[st].values()]; try { return await idbReq(st, 'readonly', s => s.getAll()); } catch (e) { return [...mem[st].values()]; } }
let warned = false;
function storageWarn() { storageOK = false; if (!warned) { warned = true; toast('השמירה במכשיר נכשלה – הנתונים זמינים רק עד סגירת הדף. מומלץ להפיק דוח או גיבוי.'); } }

/* ---------- capabilities ---------- */
let downloadsCap = null, sampleCap = null, sampleImages = false, lastFile = null;
const IN_CLAUDE = !!(window.claude && window.claude.use);
async function blobB64(b) { const u = new Uint8Array(await b.arrayBuffer()); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function apiSampler(key) {
  const f = {};
  f.limits = async () => ({ images: { maxCount: 2 } });
  f.json = async (prompt, opts = {}) => {
    const content = [];
    for (const b of [].concat(opts.images || [])) content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await blobB64(b) } });
    content.push({ type: 'text', text: prompt });
    let r;
    try {
      r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 1000, messages: [{ role: 'user', content }] }) });
    } catch (e) { throw { code: 'offline' }; }
    if (!r.ok) throw { code: r.status === 401 ? 'bad_key' : r.status === 429 ? 'rate_limited' : 'upstream_error' };
    const d = await r.json(); const t = (d.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
    const m = t.match(/\{[\s\S]*\}/); if (!m) throw { code: 'invalid_json' };

  };

}

  catch (e) { const u = URL.createObjectURL(file); const img = new Image(); img.src = u; await img.decode(); return img; }
}

  const w = Math.round(W0 * sc), h = Math.round(H0 * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));

function beginTour() {
  const tpl = TEMPLATES[T.templateId], H = T.header;

  if (!H.location) H.location = H.site;
  if (tpl.org === 'tavel' && !H.docNo) H.docNo = newDocNo();
  if (tpl.mode === 'checklist') {
    tpl.categories.forEach(c => { const s = { id: 's' + uid(), title: c.title }; T.sections.push(s); c.items.forEach(it => T.findings.push(blankFinding(s.id, { subTopic: it, status: '' }))); });
  } else T.sections.push({ id: 's' + uid(), title: tpl.defaultSection ? `${tpl.defaultSection} – ${H.site}` : '' });
  // follow-ups from previous tour at same site
  let imported = 0;
  if (tpl.org === 'tavel') {
    const prev = S.tours.filter(t => norm(t.header.site) === norm(H.site)).sort((a, b) => (b.header.date || '').localeCompare(a.header.date || ''))[0];
    if (prev) {
      prev.followups.filter(x => x.text && !/^בוצע$/.test(x.status || '')).forEach(x => { T.followups.push({ ...x, id: 'u' + uid(), status: '' }); imported++; });
      prev.findings.filter(f => f.status === 'bad').forEach(f => { T.followups.push({ id: 'u' + uid(), text: [f.notes, f.action].filter(Boolean).join(' – '), date: prev.header.date, location: f.location || f.subTopic || '', owner: f.owner || '', status: '' }); imported++; });
    }
  }
  // remember people
  T.participants.forEach(p => { if (p.name && !S.settings.people.some(q => q.name === p.name)) S.settings.people.push({ name: p.name, role: p.role }); });
  if (H.author) { S.settings.author = H.author; S.settings.authorTitle = H.authorTitle; }
  saveSettings();
  delete T._unsaved; S.tours.push(T); saveTour();
  S.view = 'tour'; S.tab = 'findings'; render();
  if (imported) toast(`יובאו ${imported} פערים מהסיור הקודם באתר`);
}

- ג'ריקנים של שמן מונחים בעמדה לא ייעודית ללא שילוט וללא מאצרה – להעביר לאחסון על גבי מאצרה
- מאצרת מיכל סולר לגנרטור מלאה בסולר. יש לפנות את הסולר מהמאצרה ואת הנסורת הספוגה שנמצאת סביב המאצרה.
- חבית מתכת ריקה לא מסומנת עומדת מחוץ לחדר. במידה והחבית אינה מיועדת לשימוש, יש לפנות בהקדם; אם מיועדת לשימוש, יש לשלט את החבית בהתאם לחומר הנמצא בה ולהעביר למאצרה.

כללים: תאר רק מה שנראה בתמונה או נאמר בהערה, בלי להמציא פרטים (שמות חומרים, כמויות) שלא ניתן לראות. אם משהו לא ברור, נסח בזהירות. ${dan ? 'בשדה notes כתוב את תיאור הממצא בלבד, ובשדה action את הפעולה המתקנת.' : 'בשדה notes כתוב את הממצא יחד עם ההנחיה לפעולה מתקנת (אם לא תקין), ובשדה action החזר מחרוזת ריקה. אם תקין – סיים ב"- תקין".'}
החזר JSON בלבד בצורה: {"status":"ok או bad","notes":"...","action":"..."}`;
  btn.disabled = true; out.textContent = 'Claude מנסח…';
  try {
    const r = await sampleCap.json(prompt, imgs.length ? { images: imgs } : {});
    if (r && typeof r.notes === 'string') {
      collectEditor(); E.notes = r.notes.trim();
      if (dan && typeof r.action === 'string' && r.action.trim()) E.action = r.action.trim();
      if (r.status === 'ok' || r.status === 'bad') { E.status = r.status; if (r.status === 'ok' && !E.due && tpl.due) E.due = 'ידיעה'; }
      renderEditor(); const o = $('#aiOut'); if (o) o.textContent = 'הניסוח הוכנס לשדות. בדוק ותקן לפני שמירה.';
    } else { out.textContent = 'לא התקבל ניסוח. נסה שוב.'; btn.disabled = false; }
  } catch (e) {
    btn.disabled = false;
    const m = { not_granted: 'השימוש ב-Claude לא אושר בדף הזה.', rate_limited: 'יותר מדי בקשות כרגע. נסה שוב בעוד דקה.', image_rejected: 'התמונה לא התקבלה. נסה תמונה אחרת.', invalid_json: 'התשובה לא הייתה בפורמט הנכון. נסה שוב.', refused: 'Claude לא ניסח את הממצא הזה.', bad_key: 'מפתח ה-API שגוי. עדכן אותו בהגדרות.', offline: 'אין חיבור לאינטרנט. הניסוח דורש חיבור.' };
    out.textContent = m[e?.code] || 'הניסוח נכשל. נסה שוב.';
    if (['not_granted', 'sampling_disabled', 'not_declared'].includes(e?.code)) { sampleCap = null; }
  }
}
function collectEditor() { document.querySelectorAll('#sheet [data-e]').forEach(el => { E[el.dataset.e] = el.value; }); }

/* ---------- annotator ---------- */
async function annotate(idx) {
  const pid = E.photos[idx]; const rec = await dbGet('photos', pid); if (!rec) return;
  const bmp = await decode(rec.blob);
  let base = document.createElement('canvas'); base.width = rec.w; base.height = rec.h; base.getContext('2d').drawImage(bmp, 0, 0, rec.w, rec.h);
  let strokes = [], tool = 'ell', cur = null;
  const L = $('#annot'); L.hidden = false;
  L.innerHTML = `<div class="anbar"><button class="ghost sm" id="anCancel">ביטול</button>
    <div class="seg"><button id="tEll" class="on">עיגול</button><button id="tPen">קו חופשי</button></div>
    <button class="ghost sm" id="anRot">סובב</button><button class="ghost sm" id="anUndo">בטל</button><button class="primary sm" id="anSave">שמור</button></div>
    <div class="anstage"><canvas id="anCv"></canvas></div>`;
  const cv = $('#anCv'), ctx = cv.getContext('2d');
  const lw = () => Math.max(4, Math.round(Math.max(base.width, base.height) * 0.007));
  const drawStroke = (c, s) => { c.strokeStyle = '#E3241B'; c.lineWidth = s.w; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
    if (s.t === 'pen') { s.p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); }
    else { const cx = (s.a[0] + s.b[0]) / 2, cy = (s.a[1] + s.b[1]) / 2, rx = Math.abs(s.b[0] - s.a[0]) / 2, ry = Math.abs(s.b[1] - s.a[1]) / 2; c.ellipse(cx, cy, Math.max(rx, 2), Math.max(ry, 2), 0, 0, Math.PI * 2); }
    c.stroke(); };
  const draw = () => { cv.width = base.width; cv.height = base.height; ctx.drawImage(base, 0, 0); strokes.forEach(s => drawStroke(ctx, s)); if (cur) drawStroke(ctx, cur); };
  const bake = () => { const c = base.getContext('2d'); strokes.forEach(s => drawStroke(c, s)); strokes = []; };
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); const p = pt(e); cur = tool === 'pen' ? { t: 'pen', w: lw(), p: [p] } : { t: 'ell', w: lw(), a: p, b: p }; };
  cv.onpointermove = e => { if (!cur) return; const p = pt(e); if (cur.t === 'pen') cur.p.push(p); else cur.b = p; draw(); };
  cv.onpointerup = () => { if (cur) { strokes.push(cur); cur = null; draw(); } };
  $('#tEll').onclick = () => { tool = 'ell'; $('#tEll').classList.add('on'); $('#tPen').classList.remove('on'); };
  $('#tPen').onclick = () => { tool = 'pen'; $('#tPen').classList.add('on'); $('#tEll').classList.remove('on'); };
  $('#anUndo').onclick = () => { strokes.pop(); draw(); };
  $('#anRot').onclick = () => { bake(); const n = document.createElement('canvas'); n.width = base.height; n.height = base.width; const c = n.getContext('2d'); c.translate(n.width, 0); c.rotate(Math.PI / 2); c.drawImage(base, 0, 0); base = n; draw(); };
  const close = () => { L.hidden = true; L.innerHTML = ''; };
  $('#anCancel').onclick = close;
  $('#anSave').onclick = async () => {
    bake(); const blob = await new Promise(r => base.toBlob(r, 'image/jpeg', 0.85));
    const nid = 'p' + uid(); await dbPut('photos', nid, { blob, w: base.width, h: base.height });
    collectEditor(); E.photos[idx] = nid; close(); renderEditor();
  };
  draw();
}

/* ---------- export ---------- */
async function exportDocx() {
  if (!window.docx) { toast('רכיב הפקת Word לא נטען. בדוק חיבור לאינטרנט ונסה שוב.'); return; }
  busy(true, 'מפיק את הדוח…');
  try {
    const logo = Uint8Array.from(atob(LOGO_B64), c => c.charCodeAt(0));
    const doc = await buildReport(window.docx, T, async id => { const p = await dbGet('photos', id); if (!p) return null; return { bytes: new Uint8Array(await p.blob.arrayBuffer()), w: p.w, h: p.h }; }, logo);
    const blob = await window.docx.Packer.toBlob(doc);
    const name = `דוח סיור ${T.header.site} ${showDate(T.header.date).replace(/\//g, '.')}.docx`.replace(/["\\/:*?<>|]/g, '');
    busy(false);
    T.status = 'done'; saveTour();
    if (IN_CLAUDE) { await saveFile(name, blob); return; }
    lastFile = new File([blob], name, { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [lastFile] }));
    const L = $('#dialog');
    L.innerHTML = `<div class="dlg"><p><b>הדוח מוכן</b><br><small class="hint">${esc(name)}</small></p>
      <div class="row end">${canShare ? '<button class="ghost" id="exShare">שתף (וואטסאפ / מייל)</button>' : ''}<button class="primary" id="exSave">שמור בטלפון</button></div>
      <div class="row end"><button class="ghost sm" id="exClose">סגור</button></div></div>`;
    L.hidden = false;
    const close = () => { L.hidden = true; L.innerHTML = ''; };
    $('#exClose').onclick = close;
    $('#exSave').onclick = () => { saveFile(name, lastFile); close(); };
    if (canShare) $('#exShare').onclick = async () => { try { await navigator.share({ files: [lastFile], title: name }); } catch (e) { } close(); };
  } catch (e) { busy(false); console.error(e); toast('הפקת הדוח נכשלה: ' + (e?.message || '')); }
}
async function saveFile(name, data) {
  if (downloadsCap) {
    try { await downloadsCap.save({ filename: name, data }); toast('הקובץ נשמר'); return true; }
    catch (e) { if (e?.code === 'declined') { toast('השמירה בוטלה'); return false; } if (e?.code === 'rate_limited') { toast('חלון שמירה כבר פתוח'); return false; } }
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = name; document.body.appendChild(a); a.click(); a.remove(); return true; }
  catch (e) { toast('לא ניתן לשמור קבצים בתצוגה הזו'); return false; }
}
async function backup() {
  busy(true, 'מכין גיבוי…');
  const photos = {};
  for (const t of S.tours) for (const f of t.findings) for (const id of f.photos) {
    if (photos[id]) continue; const p = await dbGet('photos', id); if (!p) continue;
    const b = new Uint8Array(await p.blob.arrayBuffer()); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    photos[id] = { b64: btoa(s), w: p.w, h: p.h };
  }
  const data = JSON.stringify({ app: 'eco-tour', v: 1, settings: { ...S.settings, apiKey: undefined }, tours: S.tours, photos });
  busy(false); await saveFile(`גיבוי סיורים ${showDate(today()).replace(/\//g, '.')}.json`, new Blob([data], { type: 'application/json' }));
}
async function restore(file) {
  try {
    busy(true, 'משחזר…'); const j = JSON.parse(await file.text()); if (j.app !== 'eco-tour') throw new Error('bad');
    for (const [id, p] of Object.entries(j.photos || {})) { const bin = Uint8Array.from(atob(p.b64), c => c.charCodeAt(0)); await dbPut('photos', id, { blob: new Blob([bin], { type: 'image/jpeg' }), w: p.w, h: p.h }); }
    let n = 0; for (const t of j.tours || []) { const i = S.tours.findIndex(x => x.id === t.id); if (i >= 0) S.tours[i] = t; else S.tours.push(t); await dbPut('tours', t.id, t); n++; }
    if (j.settings && !S.settings.author) { S.settings = { ...S.settings, ...j.settings }; saveSettings(); }
    busy(false); toast(`שוחזרו ${n} סיורים`); render();
  } catch (e) { busy(false); toast('הקובץ אינו גיבוי תקין של האפליקציה'); }
}
function openSettings() {
  const L = $('#dialog');
  L.innerHTML = `<div class="dlg form"><h2>הגדרות</h2>
    <label>השם שלך (ייכנס כ"נכתב ע"י")<input id="stA" value="${esc(S.settings.author)}"></label>
    <label>התפקיד שלך<input id="stT" value="${esc(S.settings.authorTitle)}"></label>
    ${IN_CLAUDE ? '' : `<label>מפתח API של Anthropic (לא חובה – לניסוח ממצאים עם Claude)<input id="stK" type="password" value="${esc(S.settings.apiKey || '')}" dir="ltr" autocomplete="off"></label><small class="hint">המפתח נשמר רק בטלפון הזה. בלי מפתח כל השאר עובד כרגיל.</small><br>`}
    <small class="hint">${S.settings.people.length} משתתפים ו-${S.settings.owners.length} אחראים שמורים להשלמה אוטומטית.</small>
    <div class="row end"><button class="ghost" id="stClr">נקה רשימות</button><button class="primary" id="stOk">שמור</button></div></div>`;
  L.hidden = false;
  $('#stClr').onclick = () => { S.settings.people = []; S.settings.owners = []; saveSettings(); toast('הרשימות נוקו'); };
  $('#stOk').onclick = () => { S.settings.author = $('#stA').value.trim(); S.settings.authorTitle = $('#stT').value.trim(); if ($('#stK')) { S.settings.apiKey = $('#stK').value.trim(); setupApiSampler(); } saveSettings(); L.hidden = true; L.innerHTML = ''; };
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset, act = d.act;
  if (d.open) { T = S.tours.find(t => t.id === d.open); S.view = 'tour'; S.tab = 'findings'; render(); return; }
  if (d.client) { T.header.client = d.client; document.querySelectorAll('[data-client]').forEach(x => x.classList.toggle('on', x === b)); renderTplBox(); return; }
  if (d.tpl) { T.templateId = d.tpl; T._manualTpl = true; renderTplBox(); return; }
  if (d.delpp) { T.participants.splice(+d.delpp, 1); saveTour(); renderSetup(); return; }
  if (d.tab) { S.tab = d.tab; render(); return; }
  if (d.edit) { openEditor(T.findings.find(f => f.id === d.edit), false); return; }
  if (d.addf) { const f = blankFinding(d.addf, { location: T._lastLocation || '', status: TEMPLATES[T.templateId].mode === 'checklist' ? '' : 'bad' }); openEditor(f, true); return; }
  if (d.rename) { const s = T.sections.find(x => x.id === d.rename); const v = await ask('שם האזור בסיור', { input: s.title }); if (v !== null) { s.title = v.trim(); saveTour(); render(); } return; }
  if (d.sum) { T.summary[d.sum] = d.v; saveTour(); $('#tabBody').innerHTML = summaryTab(); return; }
  if (d.fust) { T.followups[+d.fust].status = d.v; saveTour(); $('#tabBody').innerHTML = followupsTab(); return; }
  if (d.delfu) { if (await ask('להסיר את הפער מהרשימה?', { ok: 'הסר', danger: true })) { T.followups.splice(+d.delfu, 1); saveTour(); render(); } return; }
  if (d.st !== undefined && S.sheet) { collectEditor(); E.status = d.st; if (d.st === 'ok' && TEMPLATES[T.templateId].due && !E.due) E.due = 'ידיעה'; renderEditor(); return; }
  if (d.due && S.sheet) { const inp = document.querySelector('[data-e="due"]'); if (d.due[0] === '+') { const dt = new Date(); dt.setDate(dt.getDate() + +d.due.slice(1)); inp.value = dotDate(dt); } else inp.value = d.due; return; }
  if (d.delph) { collectEditor(); E.photos.splice(+d.delph, 1); renderEditor(); return; }
  if (d.annot) { collectEditor(); annotate(+d.annot); return; }
  switch (act) {
    case 'new': startNew(); break;
    case 'home': if (S.view === 'setup' && T?._unsaved) T = null; S.view = 'home'; render(); break;
    case 'settings': openSettings(); break;
    case 'addpp': T.participants.push({ name: '', role: '' }); renderSetup(); break;
    case 'docno': T.header.docNo = newDocNo(); renderTplBox(); break;
    case 'begin': beginTour(); break;
    case 'details': S.view = 'setup'; render(); break;
    case 'backTour': saveTour(); S.view = 'tour'; render(); break;
    case 'deltour': if (await ask('למחוק את הסיור וכל התמונות שלו? לא ניתן לשחזר.', { ok: 'מחק', danger: true })) {
      for (const f of T.findings) for (const p of f.photos) dbDel('photos', p);
      dbDel('tours', T.id); S.tours = S.tours.filter(t => t !== T); T = null; S.view = 'home'; render(); } break;
    case 'addsec': { const v = await ask('שם האזור החדש', { input: '' }); if (v) { T.sections.push({ id: 's' + uid(), title: v.trim() }); saveTour(); render(); } break; }
    case 'snap': pickPhotos(true, ids => {
      const tpl = TEMPLATES[T.templateId];
      const sec = T.sections.find(s => s.id === T._lastSection) || T.sections[T.sections.length - 1];
      openEditor(blankFinding(sec.id, { photos: ids, location: T._lastLocation || '', status: tpl.mode === 'checklist' ? 'bad' : 'bad' }), true);
    }); break;
    case 'edCam': collectEditor(); pickPhotos(true, ids => { E.photos.push(...ids); renderEditor(); }); break;
    case 'edGal': collectEditor(); pickPhotos(false, ids => { E.photos.push(...ids); renderEditor(); }); break;
    case 'closeEd': closeEditor(); break;
    case 'saveEd': collectEditor(); saveEditor(); break;
    case 'delEd': if (await ask('למחוק את הממצא?', { ok: 'מחק', danger: true })) { T.findings = T.findings.filter(f => f.id !== E.id); saveTour(); closeEditor(); render(); } break;
    case 'ai': collectEditor(); aiDraft(); break;
    case 'allok': SUMMARY_TOPICS.forEach(t => { if (!T.summary[t]) T.summary[t] = 'תקין'; }); saveTour(); $('#tabBody').innerHTML = summaryTab(); break;
    case 'addfu': T.followups.push({ id: 'u' + uid(), text: '', date: '', location: '', owner: '', status: '' }); saveTour(); render(); break;
    case 'export': exportDocx(); break;
    case 'backup': backup(); break;
    case 'restore': $('#restoreIn').value = ''; $('#restoreIn').click(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.t) { setPath(T, d.t, el.value); saveTour(); if (/client|site|location|date/.test(d.t) && T._unsaved) renderTplBox(); }
  else if (d.pp) { const [i, k] = d.pp.split('.'); T.participants[+i][k] = el.value; saveTour(); }
  else if (d.fu) { const [i, k] = d.fu.split('.'); T.followups[+i][k] = el.value; saveTour(); }
});
document.addEventListener('change', e => { if (e.target.dataset.t === 'header.date' && T?._unsaved && TEMPLATES[T.templateId].org === 'tavel') { T.header.docNo = newDocNo(); renderTplBox(); } });

/* ---------- boot ---------- */
(async function boot() {
  $('#camIn').addEventListener('change', onPicked); $('#galIn').addEventListener('change', onPicked);
  $('#restoreIn').addEventListener('change', e => { if (e.target.files[0]) restore(e.target.files[0]); });
  await openDB();
  S.tours = (await dbAll('tours')) || [];
  S.tours.forEach(t => mem.tours.set(t.id, t));
  const st = await dbGet('kv', 'settings'); if (st) S.settings = { ...S.settings, ...st };
  setupApiSampler();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  if (!IN_CLAUDE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  render();
})();

</script></body></html>
